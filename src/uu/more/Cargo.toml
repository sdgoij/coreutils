[package]
name = "uu_more"
description = "more ~ (uutils) input perusal filter"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/more"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/more.rs"
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true }
fluent = { workspace = true }

# `crossterm`'s `events` feature selects `mio`, which has no minix arm, so on
# minix the terminal surface is this crate's `minixterm` module: ANSI command
# rendering over the applet's writer, and keys decoded from `rustix::event`'s
# `poll` and a `read` of descriptor 0 (`KNOWN_ISSUES.md` item 75).
[target.'cfg(not(target_os = "minix"))'.dependencies]
crossterm = { workspace = true, features = ["events"] }

[target.'cfg(target_os = "minix")'.dependencies]
rustix = { workspace = true, features = ["event", "termios"] }

[target.'cfg(windows)'.dependencies]
crossterm = { workspace = true, features = ["windows"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
crossterm = { workspace = true, features = ["use-dev-tty"] }

[[bin]]
name = "more"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
