[package]
name = "uu_shred"
description = "shred ~ (uutils) hide former FILE contents with repeated overwrites"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/shred"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/shred.rs"
doctest = false

[dependencies]
clap = { workspace = true }
rand = { workspace = true }
uucore = { workspace = true, features = ["parser-size"] }
fluent = { workspace = true }

[target.'cfg(not(target_os = "minix"))'.dependencies]
libc = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "shred"
path = "src/main.rs"
