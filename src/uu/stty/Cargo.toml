[package]
name = "uu_stty"
description = "stty ~ (uutils) print or change terminal characteristics"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/stty"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/stty.rs"
doctest = false

[target.'cfg(unix)'.dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["parser"] }
fluent = { workspace = true }

# `nix` has no minix support and no fork; on minix the termios surface is this
# crate's own `minixterm` module, which sits on the port's `rustix::termios`
# backend (the scalar constants still come from `libc`, the fork).
[target.'cfg(all(unix, not(target_os = "minix")))'.dependencies]
nix = { workspace = true, features = ["ioctl", "term"] }

[target.'cfg(target_os = "minix")'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["termios"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "stty"
path = "src/main.rs"
required-features = ["uucore/default"]
