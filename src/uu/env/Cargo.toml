[package]
name = "uu_env"
description = "env ~ (uutils) set each NAME to VALUE in the environment and run COMMAND"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/env"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/env.rs"
doctest = false

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true, features = ["signals"] }
fluent = { workspace = true }

[target.'cfg(all(unix, not(target_os = "minix")))'.dependencies]
nix = { workspace = true, features = ["process", "signal"] }

# On minix the same calls come from the port's own C library, which implements
# `sigprocmask`, the `sigset_t` operations and `execvp` (`crates/minix-libc`).
# `nix` itself does not build: its `Signal` enum and errno tables assume a
# Linux-shaped libc.
[target.'cfg(target_os = "minix")'.dependencies]
libc = { workspace = true }

[features]
diagnostics = ["uucore/diagnostics"]

[lints]
workspace = true

[[bin]]
name = "env"
path = "src/main.rs"
